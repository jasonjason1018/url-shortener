name: url-shortener

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  php-fpm:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    container_name: php-fpm
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3308:3306"
    env_file:
      - ./docker/mysql/.env
    volumes:
      - ./dbdata:/var/lib/mysql

  redis:
    image: redis
    container_name: redis
    volumes:
      - ./redisdata:/data

volumes:
  vendor:
  dbdata:
  redisdata:
